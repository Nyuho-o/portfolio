    <h1 class="visually-hidden">From object to feelings</h1>
    <div class="project-story project-story--intro">
      <p>J’ai dessiné trois typographies à partir d’un fil. Ses mouvements et ses tensions m’ont inspiré des lettres fines, déformées ou étirées. Je voulais qu’en regardant ces lettres, on puisse sentir comment le fil bouge et se tend.</p>
    </div>
    <div class="type-spreads">
      <figure class="type-spread" aria-label="Afterimage">
        <img class="project-photo" src="../assets/afterimage-garde.webp" width="880" height="1200"
          alt="Page de garde d’Afterimage." decoding="async">
        <img class="project-photo" src="../assets/afterimage-alphabet.webp" width="889" height="1199"
          alt="Alphabet aux traits fins et discontinus." decoding="async">
      </figure>
      <figure class="type-spread" aria-label="Aftershock">
        <img class="project-photo" src="../assets/aftershock-garde.webp" width="878" height="1200"
          alt="Page de garde d’Aftershock." loading="lazy" decoding="async">
        <img class="project-photo" src="../assets/aftershock-alphabet.webp" width="878" height="1200"
          alt="Alphabet aux lettres tendues et déformées." loading="lazy" decoding="async">
      </figure>
      <figure class="type-spread" aria-label="Aftershock Extended">
        <img class="project-photo" src="../assets/aftershock-extended-garde.webp" width="865" height="1199"
          alt="Page de garde d’Aftershock Extended." loading="lazy" decoding="async">
